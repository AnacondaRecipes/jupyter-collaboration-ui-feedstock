{% set name = "jupyter-collaboration-ui" %}
{% set version = "2.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: 835e818614eb39645f2f583a57b2246d8d1ecff4ffd2d481ab4a6f6b2c45b997

build:
  number: 0
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - jupyterlab >=4.0.0
    - hatch-jupyter-builder >=0.5
    - hatchling >=1.4.0
    - pip
    - python
  run:
    - python

test:
  imports:
    - jupyter_collaboration_ui
  requires:
    - jupyterlab
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - jupyter labextension list --debug
    - jupyter labextension list --debug 2>&1 | grep -iE "collaboration-extension.*OK"    # [unix]
    - jupyter labextension list --debug 2>&1 | findstr /r /i "collaboration-extension.*OK"  # [win]

about:
  home: https://pypi.org/project/jupyter-collaboration-ui
  summary: JupyterLab/Jupyter Notebook 7+ extension providing user interface integration for real time collaboration
  description: JupyterLab/Jupyter Notebook 7+ extension providing user interface integration for real time collaboration
  license: BSD-3-Clause
  license_family: BSD
  license_file: 
    - LICENSE
    - jupyter_collaboration_ui/labextension/static/third-party-licenses.json
  dev_url: https://github.com/jupyterlab/jupyter-collaboration
  doc_url: https://jupyterlab-realtime-collaboration.readthedocs.io

extra:
  recipe-maintainers:
    - conda-forge/jupyter-collaboration
    - bollwyvl
